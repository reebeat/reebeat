# Provenance: adapted from phibkro/vektorprogrammet-reimagined @ 797e9e41d96194b9479ff224ac1c40bbc0545888 (.gitleaks.toml).
# Deviation: default rules only; the donor's national-id, bank-account, IBAN and SQL-row rules and its allowlists are dropped.
title = "reebeat secret checks"

[extend]
useDefault = true

# A speech cache provenance file names its own SHA-256 content address in a field called `key`; that is not a credential.
# The first commits named the file `<key>.json`; the history keeps that name, the cache now writes
# `<key>.provenance.json` and `<key>.words.json`.
[[allowlists]]
description = "speech cache provenance files (packages/cache-fs)"
targetRules = ["generic-api-key"]
paths = [
  '''stories/[^/]+/speech-cache/[0-9a-f]{64}(?:\.provenance|\.words)?\.json$''',
]

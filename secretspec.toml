#:schema https://secretspec.dev/schema/secretspec.schema.json
# The one secret of this repository: the npm token that the release workflow publishes with (spec 0009, Revisions).
# No value lives here or anywhere in the repository. CI reads it from the `npm-release` environment secret of the same
# name (a test keeps the two names equal). Locally: `secretspec set NPM_TOKEN` (hidden input, the keyring provider), then
# `secretspec run --reason "<why>" -- <command>`; `prompt` needs SecretSpec 0.19 or later and is ignored before it.

[project]
name = "reebeat"
revision = "1.0"

[profiles.default]
NPM_TOKEN = { description = "npm granular access token (scope @reebeat, read and write, bypass 2FA) that publishes the @reebeat packages", required = true, prompt = true }

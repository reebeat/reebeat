# Publishes the @tsukuri/* packages to npm through trusted publishing (spec 0009).
# The manual publish on main requires approval in npm-release. The workflow and environment names are registered on npm.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # Only the head of main is released; the check below ties the commit to a green `checks` run.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      checks: read
      id-token: write # npm trusted publishing (OIDC) and the provenance attestation
    env:
      # A publish that cannot produce provenance fails instead of publishing without it.
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - name: Release hold
        shell: bash
        # While .github/release-hold exists nothing below runs. The file was deleted on 2026-10-30 (spec 0009, Revisions);
        # the step stays, so a hold is again one committed file.
        run: |
          if [ -e .github/release-hold ]; then
            echo "::error::the npm release is on hold: .github/release-hold exists"
            cat .github/release-hold
            exit 1
          fi
      - name: The commit passed the checks workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "checks") | .conclusion] | first // "none"')
          echo "checks on $GITHUB_SHA: $conclusion"
          test "$conclusion" = success
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012 # v31
      - uses: cachix/cachix-action@97e5ff84d02b3b4f9936339f767e17f03c9252ed # v16
        with:
          name: devenv
      - name: Install pinned devenv CLI
        shell: bash
        run: nix profile add github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
      - name: Install workspace dependencies
        shell: bash
        run: devenv shell -- bun install --frozen-lockfile
      - name: npm supports trusted publishing
        shell: bash
        # Trusted publishing needs npm 11.5.1 or later and Node 22.14 or later (docs.npmjs.com/trusted-publishers).
        run: |
          devenv shell -- bash -c '
            version=$(npm --version)
            printf "%s\n" "11.5.1" "$version" | sort -V -C || { echo "npm $version is older than 11.5.1"; exit 1; }
            echo "npm $version"
          '
      - name: Build what is published
        shell: bash
        # Writes packages/*/dist: bundled ESM, declarations, a rewritten package.json, LICENSE, NOTICE. Fails when a
        # package would ship a file that is not built output.
        run: devenv shell -- bun run release:stage
      - name: Remove devEngines from this checkout
        shell: bash
        # npm refuses to run anywhere in a repository whose root package.json has `devEngines.packageManager` for another
        # tool (EBADDEVENGINES, bun here), and both the Publish and the Tag step run npm, so the field is removed once,
        # before them, from this runner's checkout, which is discarded when the job ends.
        run: |
          jq 'del(.devEngines)' package.json > package.json.release
          mv package.json.release package.json
      - name: Publish
        shell: bash
        # `changeset publish` runs `npm publish packages/<name>/dist --tag alpha --access public` for each version the
        # registry lacks (the tag comes from .changeset/pre.json, for the first pre-release only: see the next step).
        run: devenv shell -- bunx changeset publish --no-git-tag
      - name: Tag the pre-release
        shell: bash
        # `changeset publish` gives the pre tag (alpha) to the first pre-release of a package only; every later one goes to
        # `latest` (getReleaseTag in @changesets/cli 3.0.3: a registry entry with only pre-releases is "only-pre"), so
        # `npm i @tsukuri/core@alpha` would stay on the first one. This step points the tag at each version just published.
        # It needs `npm dist-tag` permission: a trusted publisher needs "Allow npm
        # dist-tag" and npm 11.21.0 or later (docs.npmjs.com/trusted-publishers, "Managing dist-tags"). The runner's npm
        # (10.9.9) and devenv's (11.19.0) are older, so this step runs a pinned npm through npx; the release rules test
        # refuses a pin below 11.21.0. It does nothing outside pre mode.
        run: |
          if [ "$(node -p 'require("./.changeset/pre.json").mode' 2>/dev/null)" != pre ]; then
            echo "not in pre mode: nothing to tag"
            exit 0
          fi
          tag=$(node -p 'require("./.changeset/pre.json").tag')
          for manifest in packages/*/dist/package.json; do
            spec=$(node -p 'const p=require(process.argv[1]);p.name+"@"+p.version' "./$manifest")
            npx --yes npm@11.21.1 dist-tag add "$spec" "$tag"
          done
